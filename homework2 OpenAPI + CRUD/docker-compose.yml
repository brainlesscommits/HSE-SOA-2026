services:
  postgres:
    image: postgres:17-alpine
    container_name: marketplace-postgres
    environment:
      POSTGRES_DB: marketplace
      POSTGRES_USER: marketplace
      POSTGRES_PASSWORD: marketplace
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U marketplace -d marketplace"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: flyway/flyway:11-alpine
    container_name: marketplace-migrate
    command: >-
      -url=jdbc:postgresql://postgres:5432/marketplace
      -user=marketplace
      -password=marketplace
      -connectRetries=60
      migrate
    volumes:
      - ./db/migration:/flyway/sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  app:
    build:
      context: .
    container_name: marketplace
    environment:
      PORT: "8080"
      DATABASE_URL: "postgres://marketplace:marketplace@postgres:5432/marketplace?sslmode=disable"
      JWT_SECRET: "local-development-secret-change-me"
      ACCESS_TTL: "20m"
      REFRESH_TTL: "336h"
      ORDER_LIMIT: "1m"
      ADMIN_EMAIL: "admin@marketplace.local"
      ADMIN_PASSWORD: "admin12345"
    ports:
      - "8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres_data:
