apiVersion: 1

datasources:
  - name: ClickHouse
    uid: clickhouse-analytics
    type: grafana-clickhouse-datasource
    access: proxy
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      port: 9000
      protocol: native
      defaultDatabase: analytics
      username: default
      tlsSkipVerify: true
